<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Beauty Care | Admin Dashboard</title>

    <!-- Google Font -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

<!-- =========================================
     STACKLY DASHBOARD WRAPPER
========================================= -->

<div class="stkcos-dashboard">


    <!-- =====================================
         MOBILE OVERLAY
    ====================================== -->

    <div
        class="stkcos-sidebar-overlay"
        id="stkcosSidebarOverlay"
    ></div>



    <!-- =====================================
         SIDEBAR
    ====================================== -->

    <aside
        class="stkcos-sidebar"
        id="stkcosSidebar"
    >

        <!-- CLOSE (MOBILE) -->

        <button
            type="button"
            class="stkcos-sidebar-close"
            id="stkcosSidebarClose"
            aria-label="Close Menu"
        >

            <i class="fa-solid fa-xmark"></i>

        </button>


        <!-- LOGO -->

        <div class="stkcos-sidebar-logo">

            <a href="index.html">

                <img
                    src="./white.webp"
                    alt="Stackly Logo"
                >

            </a>

        </div>



        <!-- MENU -->

        <nav class="stkcos-sidebar-menu">


            <a
                href="./admin-dashboard.html"
                class="stkcos-menu-link stkcos-active"
            >

                <span class="stkcos-menu-icon">

                    <i class="fa-solid fa-chart-line"></i>

                </span>

                <span class="stkcos-menu-text">

                    Dashboard

                </span>

            </a>



            <a
                href="profile.html"
                class="stkcos-menu-link"
            >

                <span class="stkcos-menu-icon">

                    <i class="fa-solid fa-user"></i>

                </span>

                <span class="stkcos-menu-text">

                    My Profile

                </span>

            </a>



            <a
                href="orders.html"
                class="stkcos-menu-link"
            >

                <span class="stkcos-menu-icon">

                    <i class="fa-solid fa-bag-shopping"></i>

                </span>

                <span class="stkcos-menu-text">

                    Orders

                </span>

            </a>



            <a
                href="products.html"
                class="stkcos-menu-link"
            >

                <span class="stkcos-menu-icon">

                    <i class="fa-solid fa-pump-soap"></i>

                </span>

                <span class="stkcos-menu-text">

                    Beauty Products

                </span>

            </a>





        </nav>



        <!-- LOGOUT -->

        <div class="stkcos-sidebar-bottom">


            <button
                type="button"
                class="stkcos-logout-btn"
                id="stkcosLogoutBtn"
            >

                <span class="stkcos-menu-icon">

                    <i class="fa-solid fa-right-from-bracket"></i>

                </span>

                <span>

                    Logout

                </span>

            </button>


        </div>


    </aside>



    <!-- =====================================
         MAIN AREA
    ====================================== -->

    <div class="stkcos-main-area">


        <!-- =================================
             TOP BAR
        ================================== -->

        <header class="stkcos-topbar">


            <!-- LEFT SIDE -->

            <div class="stkcos-topbar-left">


                <!-- HAMBURGER -->

                <button
                    type="button"
                    class="stkcos-hamburger"
                    id="stkcosHamburger"
                    aria-label="Open Menu"
                >

                    <span></span>

                    <span></span>

                    <span></span>

                </button>



                <div class="stkcos-page-title">

                    <h2>
                        Dashboard
                    </h2>

                    <p>
                        Welcome back to your beauty space
                    </p>

                </div>


            </div>



            <!-- RIGHT SIDE -->

            <div class="stkcos-user-area">


                <!-- USER ICON -->

                <div class="stkcos-user-avatar">

                    <i class="fa-solid fa-user"></i>

                </div>



                <!-- USER DETAILS -->

                <div class="stkcos-user-details">


                    <h4
                        id="stkcosUserName"
                    >

                        User Name

                    </h4>


                    <span
                        id="stkcosUserRole"
                        class="stkcos-user-role"
                    >

                        Customer

                    </span>


                    <p
                        id="stkcosUserEmail"
                    >

                        user@email.com

                    </p>


                </div>


            </div>


        </header>




    </div>


</div>



<!-- =========================================
     LOGOUT POPUP
========================================= -->

<div
    class="stkcos-popup-overlay"
    id="stkcosPopupOverlay"
>


    <div class="stkcos-logout-popup">


        <div class="stkcos-popup-icon">

            <i class="fa-solid fa-right-from-bracket"></i>

        </div>


        <h3>

            Ready to Leave?

        </h3>


        <p>

            Are you sure you want to logout
            from your account?

        </p>


        <div class="stkcos-popup-buttons">


            <button
                type="button"
                class="stkcos-cancel-btn"
                id="stkcosCancelLogout"
            >

                Cancel

            </button>



            <button
                type="button"
                class="stkcos-confirm-btn"
                id="stkcosConfirmLogout"
            >

                <i class="fa-solid fa-right-from-bracket"></i>

                Yes, Logout

            </button>


        </div>


    </div>


</div>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
>

<style>

    /* =========================================================
   FORCE STACKLY MOBILE HAMBURGER
   DO NOT MOVE THIS ABOVE OTHER DASHBOARD CSS
========================================================= */

@media screen and (max-width: 900px) {

/* =========================================
   HAMBURGER BUTTON
========================================= */

.stkcos-hamburger {
    display: flex !important;

    position: relative !important;

    width: 52px !important;
    height: 52px !important;

    min-width: 52px !important;
    min-height: 52px !important;

    padding: 0 !important;
    margin: 0 !important;

    flex-shrink: 0 !important;

    align-items: center !important;
    justify-content: center !important;
    flex-direction: column !important;

    gap: 6px !important;

    border: 1px solid #ead5d0 !important;
    border-radius: 12px !important;

    background: #ffffff !important;

    cursor: pointer !important;

    z-index: 999999 !important;

    visibility: visible !important;
    opacity: 1 !important;

    pointer-events: auto !important;

    box-shadow:
        0 5px 18px rgba(61, 41, 38, 0.15) !important;
}


/* =========================================
   HAMBURGER LINES
========================================= */

.stkcos-hamburger span {
    display: block !important;

    width: 25px !important;
    height: 3px !important;

    min-width: 25px !important;
    min-height: 3px !important;

    margin: 0 !important;
    padding: 0 !important;

    background: #3d2926 !important;

    border-radius: 10px !important;

    transition:
        transform 0.3s ease,
        opacity 0.25s ease !important;

    pointer-events: none !important;
}


/* =========================================
   SIDEBAR - CLOSED
========================================= */

.stkcos-sidebar {
    position: fixed !important;

    top: 0 !important;
    left: 0 !important;

    width: 300px !important;
    max-width: 85vw !important;

    height: 100vh !important;
    height: 100dvh !important;

    margin: 0 !important;

    z-index: 999998 !important;

    transform: translateX(-110%) !important;

    visibility: hidden !important;
    opacity: 1 !important;

    transition:
        transform 0.35s ease,
        visibility 0.35s ease !important;

    overflow-y: auto !important;
    overflow-x: hidden !important;
}


/* =========================================
   SIDEBAR - OPEN
========================================= */

.stkcos-sidebar.stkcos-sidebar-open {
    transform: translateX(0) !important;

    visibility: visible !important;
}


/* =========================================
   OVERLAY
========================================= */

.stkcos-sidebar-overlay {
    position: fixed !important;

    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;

    width: 100vw !important;
    height: 100vh !important;

    z-index: 999997 !important;

    display: block !important;

    background:
        rgba(0, 0, 0, 0.55) !important;

    opacity: 0 !important;
    visibility: hidden !important;

    pointer-events: none !important;

    transition:
        opacity 0.3s ease,
        visibility 0.3s ease !important;
}


/* =========================================
   OVERLAY OPEN
========================================= */

.stkcos-sidebar-overlay.stkcos-show {
    opacity: 1 !important;

    visibility: visible !important;

    pointer-events: auto !important;
}


/* =========================================
   HAMBURGER -> X
========================================= */

.stkcos-hamburger.stkcos-hamburger-active span:nth-child(1) {
    transform:
        translateY(9px)
        rotate(45deg) !important;
}

.stkcos-hamburger.stkcos-hamburger-active span:nth-child(2) {
    opacity: 0 !important;

    transform:
        scaleX(0) !important;
}

.stkcos-hamburger.stkcos-hamburger-active span:nth-child(3) {
    transform:
        translateY(-9px)
        rotate(-45deg) !important;
}


/* =========================================
   LOCK PAGE WHILE MENU IS OPEN
========================================= */

body.stkcos-menu-open {
    overflow: hidden !important;
}

}


/* =========================================================
DESKTOP
========================================================= */

@media screen and (min-width: 901px) {

.stkcos-hamburger {
    display: none !important;
}

.stkcos-sidebar {
    transform: translateX(0) !important;

    visibility: visible !important;
}

.stkcos-sidebar-overlay {
    display: none !important;
}
}
    /* =========================================================
   STACKLY COSMETIC DASHBOARD
   UPDATED FONT SIZE: 22PX
   UNIQUE PREFIX: stkcos-
========================================================= */

:root {
    --stkcos-primary: #c77b73;
    --stkcos-primary-dark: #9d5c55;
    --stkcos-primary-light: #f7e5e1;

    --stkcos-dark: #3d2926;
    --stkcos-text: #765f5b;

    --stkcos-white: #ffffff;
    --stkcos-bg: #fff8f6;

    --stkcos-border: #ead5d0;

    /* MAIN FONT SIZE */
    --stkcos-font-size: 18px;
}


/* =========================================================
   GLOBAL
========================================================= */

.stkcos-dashboard *,
.stkcos-popup-overlay * {
    box-sizing: border-box;
}

.stkcos-dashboard {
    width: 100%;
    min-height: 100vh;
    background: var(--stkcos-bg);
    font-size: 20px;
}

.stkcos-dashboard button,
.stkcos-dashboard a,
.stkcos-dashboard input,
.stkcos-dashboard select,
.stkcos-dashboard textarea {
    font-size: 20px;
}


/* =========================================================
   SIDEBAR
========================================================= */

.stkcos-sidebar {
    position: fixed;
    top: 0;
    left: 0;

    width: 300px;
    height: 100vh;
    height: 100dvh;

    display: flex;
    flex-direction: column;

    background: linear-gradient(
        180deg,
        #3d2926,
        #5a3732
    );

    z-index: 1000;

    overflow-y: auto;

    transition: transform 0.35s ease;

    box-shadow:
        5px 0 25px
        rgba(61, 41, 38, 0.12);
}


/* =========================================================
   SIDEBAR LOGO
========================================================= */

.stkcos-sidebar-logo {
    width: 100%;
    min-height: 110px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    border-bottom:
        1px solid
        rgba(255, 255, 255, 0.10);
}

.stkcos-sidebar-logo a {
    display: flex;
    align-items: center;
    justify-content: center;
}

.stkcos-sidebar-logo img {
    width: 180px;
    max-width: 100%;
    height: 65px;
    object-fit: contain;
}


/* =========================================================
   SIDEBAR CLOSE (MOBILE)
========================================================= */

.stkcos-sidebar-close {
    display: none;

    position: absolute;
    top: 18px;
    right: 18px;

    width: 40px;
    height: 40px;

    align-items: center;
    justify-content: center;

    border: none;
    border-radius: 50%;

    background: rgba(255, 255, 255, 0.10);
    color: #ffffff;

    font-size: 18px;

    cursor: pointer;

    z-index: 10;

    transition: background 0.25s ease;
}

.stkcos-sidebar-close:hover {
    background: rgba(255, 255, 255, 0.22);
}

@media (max-width: 900px) {

    .stkcos-sidebar-close {
        display: flex;
    }

}


/* =========================================================
   SIDEBAR MENU
========================================================= */

.stkcos-sidebar-menu {
    width: 100%;

    padding: 25px 18px;

    display: flex;
    flex-direction: column;

    gap: 12px;
}

.stkcos-menu-link {
    width: 100%;
    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 16px;

    padding: 12px 18px;

    border-radius: 14px;

    color:
        rgba(255, 255, 255, 0.75);

    font-size: 20px;

    font-weight: 500;

    text-decoration: none;

    transition:
        all 0.3s ease;
}

.stkcos-menu-link:hover {
    background:
        rgba(255, 255, 255, 0.10);

    color: #ffffff;

    transform:
        translateX(5px);
}

.stkcos-menu-link.stkcos-active {
    background:
        linear-gradient(
            135deg,
            var(--stkcos-primary),
            var(--stkcos-primary-dark)
        );

    color: #ffffff;

    box-shadow:
        0 8px 20px
        rgba(199, 123, 115, 0.22);
}


/* =========================================================
   MENU ICON
========================================================= */

.stkcos-menu-icon {
    width: 35px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 20px;

    flex-shrink: 0;
}


/* =========================================================
   SIDEBAR BOTTOM
========================================================= */

.stkcos-sidebar-bottom {
    margin-top: auto;

    padding: 22px 18px;

    border-top:
        1px solid
        rgba(255, 255, 255, 0.10);
}


/* =========================================================
   LOGOUT BUTTON
========================================================= */

.stkcos-logout-btn {
    width: 100%;
    min-height: 65px;

    display: flex;
    align-items: center;

    gap: 16px;

    padding: 12px 18px;

    border:
        1px solid
        rgba(255, 255, 255, 0.16);

    border-radius: 14px;

    background:
        rgba(255, 255, 255, 0.07);

    color: #ffffff;

    font-family: inherit;
    font-size: 20px;

    cursor: pointer;

    transition:
        0.3s ease;
}

.stkcos-logout-btn:hover {
    background: #d95c5c;
    border-color: #d95c5c;
}


/* =========================================================
   MAIN AREA
========================================================= */

.stkcos-main-area {
    width: 100%;
    min-height: 100vh;

    padding-left: 300px;

    transition:
        padding 0.35s ease;
}


/* =========================================================
   TOPBAR
========================================================= */

.stkcos-topbar {
    position: sticky;
    top: 0;

    width: 100%;
    min-height: 100px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 25px;

    padding: 18px 35px;

    background:
        rgba(255, 255, 255, 0.94);

    border-bottom:
        1px solid
        var(--stkcos-border);

    backdrop-filter:
        blur(15px);

    z-index: 500;
}


/* =========================================================
   TOPBAR LEFT
========================================================= */

.stkcos-topbar-left {
    display: flex;
    align-items: center;

    gap: 18px;

    min-width: 0;
}


/* =========================================================
   HAMBURGER
========================================================= */

.stkcos-hamburger {
    width: 55px;
    height: 55px;

    display: none;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    gap: 6px;

    border:
        1px solid
        var(--stkcos-border);

    border-radius: 12px;

    background: #ffffff;

    cursor: pointer;
}

.stkcos-hamburger span {
    width: 25px;
    height: 3px;

    display: block;

    border-radius: 10px;

    background:
        var(--stkcos-dark);

    transition:
        0.3s ease;
}


/* =========================================================
   PAGE TITLE
========================================================= */

.stkcos-page-title h2 {
    margin: 0;

    color:
        var(--stkcos-dark);

    font-size: 26px;

    font-weight: 700;
}

.stkcos-page-title p {
    margin: 5px 0 0;

    color:
        var(--stkcos-text);

    font-size: 20px;
}


/* =========================================================
   USER AREA
========================================================= */

.stkcos-user-area {
    display: flex;
    align-items: center;

    gap: 15px;

    min-width: 0;
}


/* =========================================================
   USER AVATAR
========================================================= */

.stkcos-user-avatar {
    width: 60px;
    height: 60px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        linear-gradient(
            135deg,
            var(--stkcos-primary-light),
            #ffffff
        );

    color:
        var(--stkcos-primary-dark);

    border:
        1px solid
        var(--stkcos-border);

    font-size: 24px;
}


/* =========================================================
   USER DETAILS
========================================================= */

.stkcos-user-details {
    min-width: 0;
}

.stkcos-user-details h4 {
    margin: 0;

    overflow: hidden;

    color:
        var(--stkcos-dark);

    font-size: 20px;

    font-weight: 700;

    white-space: nowrap;

    text-overflow: ellipsis;
}

.stkcos-user-role {
    display: inline-block;

    margin-top: 5px;

    padding: 4px 12px;

    border-radius: 20px;

    background:
        var(--stkcos-primary-light);

    color:
        var(--stkcos-primary-dark);

    font-size: 16px;

    font-weight: 700;

    text-transform: capitalize;
}

.stkcos-user-details p {
    max-width: 300px;

    margin: 5px 0 0;

    overflow: hidden;

    color:
        var(--stkcos-text);

    font-size: 18px;

    white-space: nowrap;

    text-overflow: ellipsis;
}


/* =========================================================
   PAGE CONTENT
========================================================= */

.stkcos-page-content {
    width: 100%;

    padding: 40px;
}


/* =========================================================
   WELCOME CARD
========================================================= */

.stkcos-welcome-card {
    position: relative;

    width: 100%;
    min-height: 280px;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 30px;

    padding: 45px;

    overflow: hidden;

    border-radius: 22px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            var(--stkcos-primary-light)
        );

    border:
        1px solid
        var(--stkcos-border);
}

.stkcos-welcome-content {
    position: relative;
    z-index: 2;
}

.stkcos-welcome-tag {
    display: inline-flex;
    align-items: center;

    gap: 8px;

    margin-bottom: 18px;

    color:
        var(--stkcos-primary-dark);

    font-size: 20px;

    font-weight: 700;

    letter-spacing: 1px;
}

.stkcos-welcome-card h1 {
    margin:
        0 0 15px;

    color:
        var(--stkcos-dark);

    font-size:
        clamp(
            32px,
            4vw,
            48px
        );

    line-height: 1.3;
}

.stkcos-welcome-card h1 span {
    color:
        var(--stkcos-primary);
}

.stkcos-welcome-card p {
    max-width: 650px;

    margin: 0;

    color:
        var(--stkcos-text);

    font-size: 20px;

    line-height: 1.8;
}

.stkcos-welcome-icon {
    width: 170px;
    height: 170px;

    flex-shrink: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        rgba(199, 123, 115, 0.13);

    color:
        var(--stkcos-primary);

    font-size: 75px;
}


/* =========================================================
   MOBILE SIDEBAR OVERLAY
========================================================= */

.stkcos-sidebar-overlay {
    position: fixed;

    inset: 0;

    z-index: 900;

    visibility: hidden;

    opacity: 0;

    background:
        rgba(0, 0, 0, 0.45);

    transition:
        0.3s ease;
}

.stkcos-sidebar-overlay.stkcos-show {
    visibility: visible;
    opacity: 1;
}


/* =========================================================
   LOGOUT POPUP OVERLAY
========================================================= */

.stkcos-popup-overlay {
    position: fixed;

    inset: 0;

    z-index: 3000;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;

    visibility: hidden;
    opacity: 0;

    background:
        rgba(35, 22, 20, 0.62);

    backdrop-filter:
        blur(5px);

    transition:
        0.3s ease;
}

.stkcos-popup-overlay.stkcos-popup-show {
    visibility: visible;
    opacity: 1;
}


/* =========================================================
   LOGOUT POPUP
========================================================= */

.stkcos-logout-popup {
    width: 100%;
    max-width: 500px;

    padding: 45px 35px 35px;

    border-radius: 24px;

    background: #ffffff;

    text-align: center;

    transform:
        translateY(30px)
        scale(0.95);

    transition:
        0.3s ease;

    box-shadow:
        0 25px 70px
        rgba(0, 0, 0, 0.25);
}

.stkcos-popup-show
.stkcos-logout-popup {
    transform:
        translateY(0)
        scale(1);
}


/* =========================================================
   POPUP ICON
========================================================= */

.stkcos-popup-icon {
    width: 90px;
    height: 90px;

    margin:
        0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background:
        #fff0f0;

    color:
        #d95c5c;

    font-size: 35px;
}

.stkcos-logout-popup h3 {
    margin:
        0 0 12px;

    color:
        var(--stkcos-dark);

    font-size: 30px;
}

.stkcos-logout-popup p {
    margin:
        0 0 30px;

    color:
        var(--stkcos-text);

    font-size: 20px;

    line-height: 1.7;
}


/* =========================================================
   POPUP BUTTONS
========================================================= */

.stkcos-popup-buttons {
    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 15px;
}

.stkcos-cancel-btn,
.stkcos-confirm-btn {
    min-height: 60px;

    border: none;

    border-radius: 12px;

    font-family: inherit;

    font-size: 20px;

    font-weight: 600;

    cursor: pointer;

    transition:
        0.3s ease;
}

.stkcos-cancel-btn {
    background:

<script>
    document.addEventListener(
    "DOMContentLoaded",
    function () {


        /* =============================================
           GET LOCAL STORAGE DATA
        ============================================= */

        const userName =
            localStorage.getItem(
                "userName"
            );


        const userEmail =
            localStorage.getItem(
                "userEmail"
            );


        const userRole =
            localStorage.getItem(
                "userRole"
            );


        const isLoggedIn =
            localStorage.getItem(
                "isLoggedIn"
            );


        /* =============================================
           OPTIONAL LOGIN CHECK
        ============================================= */

        if (
            !isLoggedIn
        ) {

            window.location.href =
                "login.html";

            return;

        }


        /* =============================================
           DISPLAY USER DETAILS
        ============================================= */

        const nameElement =
            document.getElementById(
                "stkcosUserName"
            );


        const emailElement =
            document.getElementById(
                "stkcosUserEmail"
            );


        const roleElement =
            document.getElementById(
                "stkcosUserRole"
            );


        const welcomeNameElement =
            document.getElementById(
                "stkcosWelcomeName"
            );


        if (
            userName &&
            nameElement
        ) {

            nameElement.textContent =
                userName;

        }


        if (
            userName &&
            welcomeNameElement
        ) {

            welcomeNameElement.textContent =
                userName;

        }


        if (
            userEmail &&
            emailElement
        ) {

            emailElement.textContent =
                userEmail;

        }


        if (
            userRole &&
            roleElement
        ) {

            roleElement.textContent =
                userRole;

        }


        /* =============================================
           SIDEBAR ELEMENTS
        ============================================= */

        const sidebar =
            document.getElementById(
                "stkcosSidebar"
            );


        const hamburger =
            document.getElementById(
                "stkcosHamburger"
            );


        const sidebarOverlay =
            document.getElementById(
                "stkcosSidebarOverlay"
            );


        const sidebarCloseBtn =
            document.getElementById(
                "stkcosSidebarClose"
            );




 
document.addEventListener("DOMContentLoaded", function () {

    /* =====================================================
       STACKLY FORCE MOBILE SIDEBAR
    ===================================================== */

    const stkcosSidebar =
        document.getElementById("stkcosSidebar");

    const stkcosHamburger =
        document.getElementById("stkcosHamburger");

    const stkcosOverlay =
        document.getElementById("stkcosSidebarOverlay");


    /* =====================================================
       SAFETY CHECK
    ===================================================== */

    if (
        !stkcosSidebar ||
        !stkcosHamburger ||
        !stkcosOverlay
    ) {
        console.error(
            "STACKLY: Sidebar or hamburger element not found."
        );

        return;
    }


    /* =====================================================
       OPEN SIDEBAR
    ===================================================== */

    function stkcosOpenSidebar() {

        stkcosSidebar.classList.add(
            "stkcos-sidebar-open"
        );

        stkcosHamburger.classList.add(
            "stkcos-hamburger-active"
        );

        stkcosOverlay.classList.add(
            "stkcos-show"
        );

        stkcosHamburger.setAttribute(
            "aria-expanded",
            "true"
        );

        stkcosHamburger.setAttribute(
            "aria-label",
            "Close Menu"
        );

        document.body.classList.add(
            "stkcos-menu-open"
        );
    }


    /* =====================================================
       CLOSE SIDEBAR
    ===================================================== */

    function stkcosCloseSidebar() {

        stkcosSidebar.classList.remove(
            "stkcos-sidebar-open"
        );

        stkcosHamburger.classList.remove(
            "stkcos-hamburger-active"
        );

        stkcosOverlay.classList.remove(
            "stkcos-show"
        );

        stkcosHamburger.setAttribute(
            "aria-expanded",
            "false"
        );

        stkcosHamburger.setAttribute(
            "aria-label",
            "Open Menu"
        );

        document.body.classList.remove(
            "stkcos-menu-open"
        );
    }


    /* =====================================================
       TOGGLE SIDEBAR
    ===================================================== */

    function stkcosToggleSidebar() {

        const isOpen =
            stkcosSidebar.classList.contains(
                "stkcos-sidebar-open"
            );

        if (isOpen) {

            stkcosCloseSidebar();

        } else {

            stkcosOpenSidebar();

        }
    }


    /* =====================================================
       HAMBURGER CLICK
    ===================================================== */

    stkcosHamburger.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            stkcosToggleSidebar();
        },
        true
    );


    /* =====================================================
       OVERLAY CLICK
       CLICKING OUTSIDE SIDEBAR CLOSES IT
    ===================================================== */

    stkcosOverlay.addEventListener(
        "click",
        function (event) {

            event.preventDefault();
            event.stopPropagation();

            stkcosCloseSidebar();
        },
        true
    );


    /* =====================================================
       MENU LINK CLICK
       CLOSE SIDEBAR AFTER NAVIGATION
    ===================================================== */

    const stkcosMenuLinks =
        document.querySelectorAll(
            ".stkcos-sidebar .stkcos-menu-link"
        );

    stkcosMenuLinks.forEach(function (link) {

        link.addEventListener(
            "click",
            function () {

                if (window.innerWidth <= 900) {

                    stkcosCloseSidebar();

                }

            },
            true
        );

    });


    /* =====================================================
       ESC KEY
    ===================================================== */

    document.addEventListener(
        "keydown",
        function (event) {

            if (
                event.key === "Escape" &&
                window.innerWidth <= 900
            ) {

                stkcosCloseSidebar();

            }

        }
    );


    /* =====================================================
       RESPONSIVE RESET
    ===================================================== */

    window.addEventListener(
        "resize",
        function () {

            if (window.innerWidth > 900) {

                stkcosCloseSidebar();

            }

        }
    );

});

        /* =============================================
           OPEN SIDEBAR
        ============================================= */

        function openSidebar() {

            sidebar.classList.add(
                "stkcos-sidebar-open"
            );


            sidebarOverlay.classList.add(
                "stkcos-show"
            );

        }


        /* =============================================
           CLOSE SIDEBAR
        ============================================= */

        function closeSidebar() {

            sidebar.classList.remove(
                "stkcos-sidebar-open"
            );


            sidebarOverlay.classList.remove(
                "stkcos-show"
            );

        }


        /* =============================================
           HAMBURGER CLICK
        ============================================= */

        if (
            hamburger
        ) {

            hamburger.addEventListener(
                "click",
                function () {


                    if (
                        sidebar.classList.contains(
                            "stkcos-sidebar-open"
                        )
                    ) {

                        closeSidebar();

                    }

                    else {

                        openSidebar();

                    }


                }
            );

        }


        /* =============================================
           OVERLAY CLICK
        ============================================= */

        if (
            sidebarOverlay
        ) {

            sidebarOverlay.addEventListener(
                "click",
                closeSidebar
            );

        }


        /* =============================================
           CLOSE (X) BUTTON CLICK
        ============================================= */

        if (
            sidebarCloseBtn
        ) {

            sidebarCloseBtn.addEventListener(
                "click",
                closeSidebar
            );

        }


        /* =============================================
           CLOSE MENU ON MOBILE
        ============================================= */

        const menuLinks =
            document.querySelectorAll(
                ".stkcos-menu-link"
            );


        menuLinks.forEach(
            function (link) {


                link.addEventListener(
                    "click",
                    function () {


                        if (
                            window.innerWidth <=
                            900
                        ) {

                            closeSidebar();

                        }


                    }
                );


            }
        );


        /* =============================================
           LOGOUT POPUP
        ============================================= */

        const logoutButton =
            document.getElementById(
                "stkcosLogoutBtn"
            );


        const popupOverlay =
            document.getElementById(
                "stkcosPopupOverlay"
            );


        const cancelLogout =
            document.getElementById(
                "stkcosCancelLogout"
            );


        const confirmLogout =
            document.getElementById(
                "stkcosConfirmLogout"
            );


        /* =============================================
           OPEN LOGOUT POPUP
        ============================================= */

        function openLogoutPopup() {

            popupOverlay.classList.add(
                "stkcos-popup-show"
            );

        }


        /* =============================================
           CLOSE LOGOUT POPUP
        ============================================= */

        function closeLogoutPopup() {

            popupOverlay.classList.remove(
                "stkcos-popup-show"
            );

        }


        /* =============================================
           LOGOUT BUTTON
        ============================================= */

        if (
            logoutButton
        ) {

            logoutButton.addEventListener(
                "click",
                openLogoutPopup
            );

        }


        /* =============================================
           CANCEL LOGOUT
        ============================================= */

        if (
            cancelLogout
        ) {

            cancelLogout.addEventListener(
                "click",
                closeLogoutPopup
            );

        }


        /* =============================================
           CLICK OUTSIDE POPUP
        ============================================= */

        if (
            popupOverlay
        ) {

            popupOverlay.addEventListener(
                "click",
                function (event) {


                    if (
                        event.target ===
                        popupOverlay
                    ) {

                        closeLogoutPopup();

                    }


                }
            );

        }


        /* =============================================
           CONFIRM LOGOUT
        ============================================= */

        if (
            confirmLogout
        ) {

            confirmLogout.addEventListener(
                "click",
                function () {


                    /* Remove login session */

                    localStorage.removeItem(
                        "userName"
                    );


                    localStorage.removeItem(
                        "userEmail"
                    );


                    localStorage.removeItem(
                        "userRole"
                    );


                    localStorage.removeItem(
                        "isLoggedIn"
                    );


                    /* Redirect to Login */

                    confirmLogout.innerHTML =

                        `
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Logging out...
                        `;


                    setTimeout(
                        function () {


                            window.location.href =
                                "login.html";


                        },
                        700
                    );


                }
            );

        }


        /* =============================================
           ESC KEY
        ============================================= */

        document.addEventListener(
            "keydown",
            function (event) {


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeSidebar();

                    closeLogoutPopup();

                }


            }
        );


    }
);
</script>
