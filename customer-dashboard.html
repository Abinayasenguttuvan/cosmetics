                "userName"
            );


        const userEmail =
            localStorage.getItem(
                "userEmail"
            );


        const userRole =
            localStorage.getItem(
                "userRole"
            );


        const isLoggedIn =
            localStorage.getItem(
                "isLoggedIn"
            );


        /* =============================================
           OPTIONAL LOGIN CHECK
        ============================================= */

        if (
            !isLoggedIn
        ) {

            window.location.href =
                "login.html";

            return;

        }


        /* =============================================
           DISPLAY USER DETAILS
        ============================================= */

        const nameElement =
            document.getElementById(
                "stkcosUserName"
            );


        const emailElement =
            document.getElementById(
                "stkcosUserEmail"
            );


        const roleElement =
            document.getElementById(
                "stkcosUserRole"
            );


        const welcomeNameElement =
            document.getElementById(
                "stkcosWelcomeName"
            );


        if (
            userName &&
            nameElement
        ) {

            nameElement.textContent =
                userName;

        }


        if (
            userName &&
            welcomeNameElement
        ) {

            welcomeNameElement.textContent =
                userName;

        }


        if (
            userEmail &&
            emailElement
        ) {

            emailElement.textContent =
                userEmail;

        }


        if (
            userRole &&
            roleElement
        ) {

            roleElement.textContent =
                userRole;

        }


        /* =============================================
           SIDEBAR ELEMENTS
        ============================================= */

        const sidebar =
            document.getElementById(
                "stkcosSidebar"
            );


        const hamburger =
            document.getElementById(
                "stkcosHamburger"
            );


        const sidebarOverlay =
            document.getElementById(
                "stkcosSidebarOverlay"
            );


        /* =============================================
           OPEN SIDEBAR
        ============================================= */

        function openSidebar() {

            sidebar.classList.add(
                "stkcos-sidebar-open"
            );


            sidebarOverlay.classList.add(
                "stkcos-show"
            );

        }


        /* =============================================
           CLOSE SIDEBAR
        ============================================= */

        function closeSidebar() {

            sidebar.classList.remove(
                "stkcos-sidebar-open"
            );


            sidebarOverlay.classList.remove(
                "stkcos-show"
            );

        }


        /* =============================================
           HAMBURGER CLICK
        ============================================= */

        if (
            hamburger
        ) {

            hamburger.addEventListener(
                "click",
                function () {


                    if (
                        sidebar.classList.contains(
                            "stkcos-sidebar-open"
                        )
                    ) {

                        closeSidebar();

                    }

                    else {

                        openSidebar();

                    }


                }
            );

        }


        /* =============================================
           OVERLAY CLICK
        ============================================= */

        if (
            sidebarOverlay
        ) {

            sidebarOverlay.addEventListener(
                "click",
                closeSidebar
            );

        }


        /* =============================================
           CLOSE MENU ON MOBILE
        ============================================= */

        const menuLinks =
            document.querySelectorAll(
                ".stkcos-menu-link"
            );


        menuLinks.forEach(
            function (link) {


                link.addEventListener(
                    "click",
                    function () {


                        if (
                            window.innerWidth <=
                            900
                        ) {

                            closeSidebar();

                        }


                    }
                );


            }
        );


        /* =============================================
           LOGOUT POPUP
        ============================================= */

        const logoutButton =
            document.getElementById(
                "stkcosLogoutBtn"
            );


        const popupOverlay =
            document.getElementById(
                "stkcosPopupOverlay"
            );


        const cancelLogout =
            document.getElementById(
                "stkcosCancelLogout"
            );


        const confirmLogout =
            document.getElementById(
                "stkcosConfirmLogout"
            );


        /* =============================================
           OPEN LOGOUT POPUP
        ============================================= */

        function openLogoutPopup() {

            popupOverlay.classList.add(
                "stkcos-popup-show"
            );

        }


        /* =============================================
           CLOSE LOGOUT POPUP
        ============================================= */

        function closeLogoutPopup() {

            popupOverlay.classList.remove(
                "stkcos-popup-show"
            );

        }


        /* =============================================
           LOGOUT BUTTON
        ============================================= */

        if (
            logoutButton
        ) {

            logoutButton.addEventListener(
                "click",
                openLogoutPopup
            );

        }


        /* =============================================
           CANCEL LOGOUT
        ============================================= */

        if (
            cancelLogout
        ) {

            cancelLogout.addEventListener(
                "click",
                closeLogoutPopup
            );

        }


        /* =============================================
           CLICK OUTSIDE POPUP
        ============================================= */

        if (
            popupOverlay
        ) {

            popupOverlay.addEventListener(
                "click",
                function (event) {


                    if (
                        event.target ===
                        popupOverlay
                    ) {

                        closeLogoutPopup();

                    }


                }
            );

        }


        /* =============================================
           CONFIRM LOGOUT
        ============================================= */

        if (
            confirmLogout
        ) {

            confirmLogout.addEventListener(
                "click",
                function () {


                    /* Remove login session */

                    localStorage.removeItem(
                        "userName"
                    );


                    localStorage.removeItem(
                        "userEmail"
                    );


                    localStorage.removeItem(
                        "userRole"
                    );


                    localStorage.removeItem(
                        "isLoggedIn"
                    );


                    /* Redirect to Login */

                    confirmLogout.innerHTML =

                        `
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        Logging out...
                        `;


                    setTimeout(
                        function () {


                            window.location.href =
                                "login.html";


                        },
                        700
                    );


                }
            );

        }


        /* =============================================
           ESC KEY
        ============================================= */

        document.addEventListener(
            "keydown",
            function (event) {


                if (
                    event.key ===
                    "Escape"
                ) {

                    closeSidebar();

                    closeLogoutPopup();

                }


            }
        );


    }
);
</script>
